name: Test runtime package

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  package-and-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            pandoc python3 texlive-luatex texlive-latex-extra texlive-fonts-extra \
            texlive-lang-english texlive-lang-italian texlive-science
      - name: Package this commit without requiring a first published release
        run: |
          # This test-only tag lives in the disposable checkout and is never pushed.
          git tag --force v0.0.0 HEAD
          python3 scripts/package-release.py --tag v0.0.0 --output dist
      - name: Compile with the extracted package
        run: sh scripts/smoke-test.sh dist/handouts-0.0.0.tar.gz
      - name: Save the tested runtime package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: handouts-runtime-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
